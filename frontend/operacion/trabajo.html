<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lodgy · Servicios generales</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <!-- Cabecera -->
    <header class="cabecera">
        <div class="cabecera-superior">
            <h1 class="cabecera-titulo">Lodgy · Servicios generales</h1>
            <button class="btn btn-pequeno btn-secundario" id="btnCerrarSesion" aria-label="Cerrar sesión">Cerrar sesión</button>
        </div>
        <div class="cabecera-usuario" id="nombreUsuario">Usuario</div>
        <div class="cabecera-info">
            <div id="actualizadoA">Actualizado a las --:--</div>
            <div class="cabecera-botones">
                <button class="btn btn-pequeno" id="btnActualizar" aria-label="Actualizar listas">Actualizar</button>
            </div>
        </div>
    </header>

    <!-- Contenedor de mensajes -->
    <div class="mensajes-contenedor" aria-live="polite" id="mensajesContenedor"></div>

    <!-- Contenedor principal -->
    <main class="contenedor-principal">
        <!-- Estado de carga inicial -->
        <div id="estadoCarga" class="estado-carga">Cargando...</div>

        <!-- Sección: Cabañas por limpiar -->
        <section class="seccion" id="seccionCabanas" style="display: none;">
            <h2 class="seccion-titulo">
                Cabañas por limpiar (<span id="contadorCabanas">0</span>)
            </h2>
            <div id="listaCabanas" class="lista-cabanas"></div>
            <div id="sinCabanas" class="mensaje-vacio" style="display: none;">
                No hay cabañas por limpiar
            </div>
        </section>

        <!-- Sección: Daños pendientes -->
        <section class="seccion" id="seccionDanos" style="display: none;">
            <h2 class="seccion-titulo">
                Daños pendientes (<span id="contadorDanos">0</span>)
            </h2>
            <div id="listaDanos" class="lista-danos"></div>
            <div id="sinDanos" class="mensaje-vacio" style="display: none;">
                No hay daños pendientes
            </div>
        </section>
    </main>

    <!-- Botón fijo para reportar daño -->
    <div class="boton-fijo-contenedor">
        <button class="btn btn-grande boton-fijo" id="btnReportarDano" aria-label="Reportar daño">+ Reportar daño</button>
    </div>

    <!-- Panel/Formulario para reportar daño -->
    <div id="panelReporte" class="panel-overlay" role="dialog" aria-modal="true" aria-labelledby="tituloReporte">
        <div class="panel-formulario">
            <h2 class="panel-titulo" id="tituloReporte">Reportar daño</h2>
            
            <div class="form-grupo">
                <label class="form-label" for="selectCabana">Cabaña</label>
                <select id="selectCabana" class="form-select" aria-required="true"></select>
            </div>

            <div class="form-grupo">
                <label class="form-label" for="descripcionDano">Descripción (obligatoria)</label>
                <textarea 
                    id="descripcionDano" 
                    class="form-textarea" 
                    maxlength="300"
                    aria-required="true"
                    aria-describedby="contadorCaracteres"
                ></textarea>
                <small id="contadorCaracteres" style="color: var(--color-texto-secundario); font-size: 0.85rem;">
                    <span id="contadorActual">0</span>/300 caracteres
                </small>
            </div>

            <div class="form-checkbox-grupo">
                <input type="checkbox" id="bloqueaCabana" class="form-checkbox" aria-label="La cabaña no se puede usar">
                <label for="bloqueaCabana" class="form-checkbox-label">La cabaña no se puede usar</label>
            </div>

            <div class="panel-botones">
                <button class="btn" id="btnEnviarReporte" aria-label="Enviar reporte">Enviar</button>
                <button class="btn btn-secundario" id="btnCancelarReporte" style="background-color: var(--color-fondo-blanco); color: var(--color-principal); border-color: var(--color-principal);" aria-label="Cancelar">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="trabajo.js"></script>
</body>
</html>
